{% extends 'base.html' %}

{% block title %}
    Yeni personaj
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                <span class="badge rounded-pill badge-kicker mb-3">
                    <i class="bi bi-plus-lg"></i>
                    Yeni personaj
                </span>
                <h1>
                    Yeni personaj yarat
                </h1>

                <p class="text-secondary">
                    Personajın məlumatlarını daxil edin.
                </p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="mb-3">
                        {{ form.as_div }}
                    </div>
                    <div class="d-flex flex-wrap gap-2 pt-3 mt-3 border-top">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Personaj yarat
                        </button>

                        <a
                            href="{% url 'characters:characters_list' %}"
                            class="btn btn-outline-secondary"
                        >
                            Ləğv et
                        </a>

                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
