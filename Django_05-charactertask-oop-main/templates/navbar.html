{% load static %}
{% with url_name=request.resolver_match.url_name %}
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Characters OOP
            </a>
            <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Menyu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'home' %} active{% endif %}"
                                href="{% url 'home' %}"
                                {% if url_name == 'home' %}aria-current="page"{% endif %}
                        >Ana səhifə</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'characters_list' %} active{% endif %}"
                                href="{% url 'characters:characters_list' %}"
                                {% if url_name == 'characters_list' %}aria-current="page"{% endif %}
                        >Personajlar</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'character_create' %} active{% endif %}"
                                href="{% url 'characters:character_create' %}"
                                {% if url_name == 'character_create' %}aria-current="page"{% endif %}
                        >Yeni personaj</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'character_attack' %} active{% endif %}"
                                href="{% url 'characters:character_attack' %}"
                                {% if url_name == 'character_attack' %}aria-current="page"{% endif %}
                        >Hücum</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'oop_demo' %} active{% endif %}"
                                href="{% url 'characters:oop_demo' %}"
                                {% if url_name == 'oop_demo' %}aria-current="page"{% endif %}
                        >OOP demo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
{% endwith %}
