{% load static %}

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'characters/css/style.css' %}">
    <title>{% block title %}
        Characters OOP
    {% endblock %}</title>
</head>

<body class="d-flex flex-column min-vh-100">

{% include 'navbar.html' %}
<main class="flex-grow-1">
    <div class="container py-4 py-lg-5">
        {% if messages %}
            <div class="flash-messages mb-3">
                {% for message in messages %}
                    <div
                        class="alert {% if 'error' in message.tags %}alert-danger{% elif 'success' in message.tags %}alert-success{% elif 'warning' in message.tags %}alert-warning{% else %}alert-info{% endif %} mb-2"
                        role="alert"
                    >
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}

        {% endblock %}
    </div>
</main>
<footer class="border-top py-3 mt-auto">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 text-secondary">
        <span class="fw-semibold text-dark">Characters OOP</span>
        <span>Python OOP + Django</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
